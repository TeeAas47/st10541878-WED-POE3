<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Choppies Supermarket Haatso Ghana - Groceries, Fresh-produce, Household-products"
    <title>Contact Choppies Supermarket</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>Choppies Supermarket</h1>

        <nav>
            <a href="../index.html">Home</a>
            <a href="about.html">About</a>
            <a href="products.html">Products</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Contact Us</h2>

            <div class="contact-info">
                <p><strong>Choppies Supermarket</strong></p>
                <p>Phone: 012 345 6789</p>
                <p>Email: info@choppies.co.za</p>
                <p>Address: South Africa</p>
            </div>
        </section>

        <section>
            <h2>Send Us a Message</h2>

            <form id="contactForm">

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>

                <br><br>

                <input type="submit" value="Send Message">

            </form>
        </section>

        <section>
            <h2>Find a Choppies Store</h2>

            <div class="map-container">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d35503896.89428041!2d-19.14472891541349!3d4.129719259044646!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xfdf9c51645518af%3A0x9f25d91e0237ec0b!2sChoppies%20Supermarket!5e0!3m2!1sen!2sza!4v1789716350469!5m2!1sen!2sza" 
                    width="600"
                     height="450" 
                     style="border:0;" 
                     allowfullscreen="" 
                     loading="lazy" 
                     referrerpolicy="strict-origin-when-cross-origin"
                </iframe>
            </div>
        </section>

    </main>

        <p>&copy; 2026 Choppies Supermarket. All rights reserved.</p>
    </footer>

    <script src="../js/script.js"></script>

</body>
</html>
